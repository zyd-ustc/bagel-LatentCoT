# Phase 1A T0: offline BAGEL Text-CoT, frozen strict Read, O_mem-only OPD.
# Supply paths on the CLI; formal training requires held-out semantic evidence
# inside teacher_baseline_json. Field-only runs require --allow-field-only-debug
# and --max-steps <= 10.
model_path: null
prompt_data: null
teacher_cot_data: null
teacher_baseline_json: null
output_dir: null
device: auto
seed: 42
num_loop_tokens: 8
memory_loop_start_layer: 12
memory_loop_end_layer: 20
memory_init: prompt_hidden_uniform
memory_writer_trainable: false
o_adapter_rank: 8
o_adapter_alpha: 16
teacher_type: bagel_text_cot
teacher_mode: t2i
cfg_text_scale: 1.0
cfg_img_scale: 1.0
height: 512
width: 512
num_steps: 50
timestep_shift: 3.0
states_per_rollout: 2
timestep_bucket_weights: [0.5, 0.4, 0.1]
loss_type: velocity_mse
learning_rate: 1.0e-4
max_grad_norm: 1.0
max_steps: 5000
save_steps: 250
eval_steps: 250
