[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bagel-latent-cot"
version = "0.7.0"
description = "BAGEL native T2I fine-tuning and UND spatial correction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.5.1",
  "einops>=0.7.0",
  "accelerate>=0.34.0",
  "transformers>=4.56.0,<4.58.0",
  "safetensors>=0.4.0",
  "Pillow>=10.0.0",
  "PyYAML>=6.0",
  "tqdm>=4.66.0",
  "numpy>=1.26.0",
  "scipy>=1.10.0",
]

[project.scripts]
bagel-correction = "qwen_latent_cot.correction.cli:main"
bagel-t2i = "qwen_latent_cot.t2i.cli:main"
u15-pipeline = "qwen_latent_cot.u15.cli:main"

[project.optional-dependencies]
tracking = ["wandb==0.22.3", "protobuf>=3.19,<5"]
dev = [
  "pytest>=8.0.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["qwen_latent_cot*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
