# Set the native checkpoint, prompt/image JSONL, and output directory.
model_path: /path/to/BAGEL-7B-MoT
data_path: /path/to/t2i_train.jsonl
output_dir: outputs/umm_stage1_gen_only
device: auto
seed: 0
# Native BAGEL training default; separate from inference schedule shift.
timestep_shift: 1.0
# Native resize retains the full frame and its aspect ratio.
image_size: 512
min_image_size: 256
max_pixels: 262144
text_cond_dropout_prob: 0.1
bucket_weights:
  ordinary: 0.4
  structural: 0.3
  easy: 0.2
  noop: 0.1
max_train_loop_depth: 3
batch_size: 1
steps: 1000
learning_rate: 0.0001
weight_decay: 0.0
max_grad_norm: 1.0
save_every: 100
gradient_checkpointing: true
# First 30% R=1; middle 40% R in {1,2}; last 30% R in {1,2,3}.
# A new maximum depth runs at the first step of each phase.
depth_curriculum:
  - until: 0.3
    depths: [1]
  - until: 0.7
    depths: [1, 2]
  - until: 1.0
    depths: [1, 2, 3]
loop:
  enable_t2i_loop: true
  loop_mode: gen_only
  loop_start_layer: 16
  loop_end_layer: 24
  runtime_loop_depth: 3
  allocated_max_loop_depth: 4
  memory_slots: 0
  freeze_prompt_kv_in_loop: true
  reentry_adapter_type: low_rank
  reentry_rank: null
  loop_gate_init: 0.02
  # No memory seed: nonzero alpha lets the zero adapter bias learn.
  # The initial output is still exactly native because correction is zero.
  loop_output_alpha_init: 0.01
  loop_deep_supervision: true
  loop_ds_weight: 0.5
  memory_control: correct
  log_loop_stats: true
