# Phase 1.2A: frozen UND-Q Read + fresh, trainable GEN-Q Write.
model_path: /data/zyd_workspace/bagel-LatentCoT/models/Bagel-7B-MoT
data_path: /data/zyd_workspace/bagel-LatentCoT/datasets/phase1_structured/full_seed42_v2/train_candidates.jsonl
read_adapter: /data/zyd_workspace/outputs/bagel_loop_pair_memory_early/pair_memory_adapter_step_0001000.safetensors
output_dir: /data/zyd_workspace/outputs/bagel_loop_pair_flow_early_fresh
device: auto

seed: 42
num_image_tokens: 4900
stage_a_only: true
noop_fraction: 0.20

num_loop_tokens: 8
loop_depth: 2
loop_recycle_mode: same_depth
loop_memory_persist: false
loop_uncond_memory: m0
memory_loop_start_layer: 12
memory_loop_end_layer: 20
round0_memory_write_enabled: false

# Conditional training only; CFG is validation/inference behavior.
cfg_text_scale: 1.0
cfg_img_scale: 1.0

lora_rank: 8
lora_alpha: 16
lora_dropout: 0.0
gen_attention_o_lora: false
k_v_lora: false

timestep_bucket_weights: [0.5, 0.3, 0.2]
learning_rate: 5.0e-6
betas: [0.9, 0.95]
weight_decay: 0.0
max_grad_norm: 1.0
warmup_ratio: 0.03
max_steps: 1000
logging_steps: 1
save_steps: 100

vit_max_image_size: 980
vit_min_image_size: 224
vit_image_stride: 14
