# Set the native checkpoint, prompt/image JSONL, and output directory.
model_path: /path/to/BAGEL-7B-MoT
data_path: /path/to/t2i_train.jsonl
output_dir: outputs/umm_stage1
device: auto
seed: 0
# Native BAGEL training default; separate from inference schedule shift.
timestep_shift: 1.0
image_size: 512
batch_size: 1
steps: 1000
learning_rate: 0.0001
weight_decay: 0.0
max_grad_norm: 1.0
save_every: 100
gradient_checkpointing: true
# First 30% R=1; middle 40% R in {1,2}; last 30% R in {1,2,3}.
# A new maximum depth runs at the first step of each phase.
depth_curriculum:
  - until: 0.3
    depths: [1]
  - until: 0.7
    depths: [1, 2]
  - until: 1.0
    depths: [1, 2, 3]
loop:
  enable_t2i_loop: true
  loop_mode: gen_memory_anchored
  loop_start_layer: 16
  loop_end_layer: 24
  loop_depth: 3
  memory_slots: 8
  freeze_prompt_kv_in_loop: true
  reentry_adapter_type: low_rank
  reentry_rank: null
  loop_gate_init: 0.02
  loop_output_alpha_init: 0.0
  loop_deep_supervision: true
  loop_ds_weight: 0.5
  memory_control: correct
  log_loop_stats: false
