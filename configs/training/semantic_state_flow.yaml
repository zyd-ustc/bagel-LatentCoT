model_path: /private/yida_workspace/models/BAGEL-7B-MoT
data_paths:
  - /private/yida_workspace/data/CORT-V4/cort_sft_consis_v4/meta/training/cort_v4_train_unicot_fixed_v2.jsonl
output_dir: /private/yida_workspace/outputs/bagel_semantic_state_flow_k16
device: cuda:0

seed: 42
image_size: 512
num_image_tokens: 1024
batch_size: 1
num_workers: 4
max_steps: 100
save_steps: 25

loop_start_layer: 10
loop_end_layer: 18
loop_state_mode: semantic_token
loop_state_tokens: 16
loop_state_scale: 0.20
loop_draft_state_scale: 0.20
loop_state_timestep_threshold: 0.05
loop_residual_alpha: 1.0
rollout_steps: 4
timestep_shift: 3.0

lora_rank: 8
lora_alpha: 16
lora_dropout: 0.0
include_text_kv_lora: true
learning_rate: 1.0e-5
max_grad_norm: 1.0
