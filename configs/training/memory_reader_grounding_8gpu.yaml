# batch_size is PER RANK: torchrun with 8 ranks gives global batch 16.
model_path: ""
data_path: experiments/data/geneval2_hard_rl_train.jsonl
output_dir: ""
device: auto
seed: 42
shuffle_data: true
distributed_timeout_seconds: 1800
num_loop_tokens: 8
memory_loop_start_layer: 12
memory_loop_end_layer: 20
num_read_rounds: 1
num_write_rounds: 1
loop_recycle_mode: same_depth
loop_memory_persist: false
loop_update_mode: plain
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.0
k_v_lora: false
cfg_text_scale: 1.0
cfg_img_scale: 1.0
batch_size: 2
height: 512
width: 512
num_steps: 50
timestep_shift: 3.0
objective: native_teacher
state_source: native_rollout
states_per_prompt: 3
timestep_bucket_weights: [0.5, 0.3, 0.2]
max_steps: 5000
save_steps: 100
max_grad_norm: 1.0
trainable_routes: [q_proj_moe_gen]
learning_rate: 5.0e-6
write_prompt_mask_prob_start: 0.50
write_prompt_mask_prob_end: 0.10
write_prompt_mask_decay_steps: 3000
lambda_teacher: 1.0
lambda_dep_shuffle: 0.5
lambda_dep_zero: 0.25
lambda_direction: 0.1
dependency_margin: 0.02
